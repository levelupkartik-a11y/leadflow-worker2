name: Worker 2 Pipeline

on:
  workflow_dispatch:
    inputs:
      mapsLink:
        description: 'Google Maps Link for the business'
        required: true
        type: string
      rowId:
        description: 'Row ID in the Google Sheet (e.g., 2)'
        required: true
        type: string
      sheetName:
        description: 'Google Sheet Tab Name (e.g., Sector 17 Chandigarh)'
        required: true
        type: string
        default: 'Sector 17 Chandigarh'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          node index.js "${{ github.event.inputs.mapsLink }}" "${{ github.event.inputs.rowId }}" "${{ github.event.inputs.sheetName }}"
